
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1119">
<title>PozzaPlan – Login</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#0b1119;color:#f2f5f9;
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:20px
}
.container{width:100%;max-width:420px}
.logo{font-size:34px;font-weight:800;margin-bottom:8px}
.logo span{color:#f59e0b}
.subtitle{color:#8b98a9;margin-bottom:28px}
.card{
background:#141e2b;border:1px solid #263548;
border-radius:20px;padding:24px
}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tabs button{
flex:1;padding:12px;border:0;border-radius:12px;
background:#202d3d;color:#aebaca;font-weight:700
}
.tabs button.active{background:#f59e0b;color:#111}
input{
width:100%;padding:14px;margin:8px 0;
border:1px solid #334357;border-radius:12px;
background:#0b1119;color:white;font-size:16px
}
.action{
width:100%;padding:14px;margin-top:12px;
background:#f59e0b;border:0;border-radius:12px;
font-weight:800;font-size:16px;color:#111
}
.message{margin-top:16px;font-size:14px;line-height:1.5}
.small{color:#8492a5;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="container">
  <div class="logo">Pozza<span>Plan</span></div>
  <div class="subtitle">Dein Team. Dein Dienstplan.</div>

  <div class="card">
    <div class="tabs">
      <button id="loginTab" class="active" onclick="showLogin()">Login</button>
      <button id="registerTab" onclick="showRegister()">Registrieren</button>
    </div>

    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="E-Mail-Adresse" required>
      <input id="loginPassword" type="password" placeholder="Passwort" required>
      <button class="action" type="submit">Einloggen</button>
    </form>

    <form id="registerForm" style="display:none">
      <input id="registerName" type="text" placeholder="Vor- und Nachname" required>
      <input id="registerEmail" type="email" placeholder="E-Mail-Adresse" required>
      <input id="registerPassword" type="password" placeholder="Passwort (mind. 6 Zeichen)" minlength="6" required>
      <button class="action" type="submit">Account erstellen</button>
    </form>

    <div id="message" class="message"></div>
  </div>
  <div class="small">PozzaPlan · Personalplanung</div>
</div>

<script type="module">
import { createClient } from
"https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://zzryzpjoxxpzfrzzlsvs.supabase.co";
const SUPABASE_KEY = "sb_publishable_SQgTXMfuzKWQ55_nvTNRaA_Z7pFL9_R";

const message = document.getElementById("message");

let supabase;

try {
  supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  message.textContent = "Supabase-Client geladen.";
} catch (err) {
  message.textContent = "Fehler beim Laden: " + err.message;
}

window.showLogin = () => {
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  message.textContent = "Login wird geprüft...";

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    const { data: profile, error: profileError } = await supabase
      .from("profiles")
      .select("status,role")
      .eq("id", data.user.id)
      .single();

    if (profileError) throw profileError;

    if (profile.status !== "active") {
      message.textContent = "Dein Account ist noch nicht freigeschaltet.";
      await supabase.auth.signOut();
      return;
    }

    message.textContent = "Login erfolgreich!";
    window.location.href = "./index.html";

  } catch (err) {
    message.textContent = "Login-Fehler: " + err.message;
  }
});
</script>
</body>
</html>
