
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1119">
<title>PozzaPlan – Dienstplan</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1119;
  color:#f2f5f9;
  font-family:system-ui,-apple-system,sans-serif
}
button{font:inherit;cursor:pointer}
.container{max-width:900px;margin:auto;padding:20px 16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.brand{font-size:24px;font-weight:850;color:#f97316}
.sub{font-size:12px;color:#94a3b8}
.section{
  background:#17212d;border:1px solid #263546;
  border-radius:18px;padding:18px;margin-bottom:18px
}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:23px;margin:0}
h2{font-size:18px;margin:0}
button{
  background:#263546;color:white;border:0;
  border-radius:11px;padding:10px 14px
}
.week-controls{display:flex;align-items:center;gap:10px}
.week-label{font-weight:700;text-align:center}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:18px}
.day{
  background:#0e1823;border-radius:12px;padding:10px 3px;
  text-align:center;min-height:75px
}
.day-name{font-size:11px;color:#94a3b8}
.day-number{font-weight:700;margin-top:6px}
.day.active{background:#f97316}
.day.active .day-name{color:white}
.shift{
  background:#0e1823;border:1px solid #263546;
  border-radius:14px;padding:16px;margin-top:12px
}
.shift-title{font-weight:750;font-size:16px}
.shift-time{color:#94a3b8;font-size:13px;margin-top:5px}
.shift-info{font-size:13px;color:#cbd5e1;margin-top:12px}
.open{color:#fdba74;font-weight:700}
.empty{color:#94a3b8;font-size:14px;margin-top:15px}
.add{
  width:100%;background:#f97316;color:white;
  font-weight:750;margin-top:15px
}
.back{
  display:block;text-decoration:none;color:#fb923c;
  margin-bottom:20px
}
@media(min-width:650px){
.container{padding:30px}
}
</style>
</head>

<body>
<div class="container">

<header>
<div>
<div class="brand">🍕 PozzaPlan</div>
<div class="sub">Pizzeria · Dienstplanung</div>
</div>
</header>

<a class="back" href="./index.html">← Zur Übersicht</a>

<section class="section">
<div class="head">
<h1>Dienstplan</h1>
</div>

<div class="head" style="margin-top:20px">
<button id="prev">‹</button>
<div class="week-label" id="weekLabel"></div>
<button id="next">›</button>
</div>

<div class="days" id="days"></div>
</section>

<section class="section">
<div class="head">
<h2>Schichten</h2>
</div>

<div class="shift">
<div class="shift-title">☀️ Mittagsschicht</div>
<div class="shift-time">11:00 – 16:00 Uhr</div>
<div class="shift-info">
Besetzung: <span class="open">Noch keine Mitarbeiter</span>
</div>
</div>

<div class="shift">
<div class="shift-title">🌙 Abendschicht</div>
<div class="shift-time">17:00 – 23:00 Uhr</div>
<div class="shift-info">
Besetzung: <span class="open">Noch keine Mitarbeiter</span>
</div>
</div>

<button class="add" id="addShift">+ Schicht hinzufügen</button>
</section>

</div>

<script>
let offset=0;

function render(){
 const now=new Date();
 now.setHours(0,0,0,0);

 const monday=new Date(now);
 monday.setDate(now.getDate()-((now.getDay()+6)%7)+offset*7);

 const sunday=new Date(monday);
 sunday.setDate(monday.getDate()+6);

 const format=d=>d.toLocaleDateString("de-DE",{
  day:"2-digit",month:"2-digit",year:"numeric"
 });

 document.getElementById("weekLabel").textContent=
 format(monday)+" – "+format(sunday);

 const names=["Mo","Di","Mi","Do","Fr","Sa","So"];

 document.getElementById("days").innerHTML=
 names.map((name,i)=>{
  const d=new Date(monday);
  d.setDate(monday.getDate()+i);

  return `
  <div class="day ${d.toDateString()===now.toDateString()?"active":""}">
   <div class="day-name">${name}</div>
   <div class="day-number">${d.getDate()}</div>
  </div>`;
 }).join("");
}

document.getElementById("prev").onclick=()=>{
 offset--;
 render();
};

document.getElementById("next").onclick=()=>{
 offset++;
 render();
};

document.getElementById("addShift").onclick=()=>{
 alert("Die Schichtverwaltung bauen wir im nächsten Schritt ein.");
};

render();
</script>
</body>
</html>
