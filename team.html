
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PozzaPlan – Team</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1119;color:#f2f5f9;font-family:system-ui,sans-serif}
.app{max-width:760px;margin:auto;padding:20px 15px 40px}
h1{margin-bottom:5px}
.sub{color:#98a6b8;margin-bottom:24px}
.card{background:#151f2b;border:1px solid #263547;border-radius:16px;padding:17px;margin-bottom:15px}
.person{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #263547}
.person:last-child{border-bottom:none}
.name{font-weight:600}
.email{color:#98a6b8;font-size:13px;word-break:break-all}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.approve{background:#31c48d;color:#071b14}
.back{background:#253446;color:white;margin-bottom:20px}
.status{color:#98a6b8;font-size:14px}
.empty{color:#98a6b8;padding:10px 0}
input{width:100%;padding:12px;margin:7px 0 12px;border-radius:10px;border:1px solid #34465a;background:#0b1119;color:white;font:inherit}
.create{width:100%;background:#31c48d;color:#071b14;margin-top:5px}
</style>
</head>
<body>
<div class="app">
<button class="back" onclick="location.href='./index.html'">← Dashboard</button>

<h1>👥 Mitarbeiterverwaltung</h1>
<div class="sub">PozzaPlan – Team verwalten</div>

<div class="card">
<h3>➕ Mitarbeiter erstellen</h3>

<form id="createForm">
<input id="firstName" placeholder="Vorname" required>
<input id="lastName" placeholder="Nachname" required>
<input id="newEmail" type="email" placeholder="E-Mail-Adresse" required>
<input id="newPassword" type="password" placeholder="Temporäres Passwort (mind. 8 Zeichen)" minlength="8" required>

<button class="create" type="submit">Mitarbeiter erstellen</button>
</form>
<div id="createMessage" class="status"></div>
</div>

<div class="card">
<h3>⏳ Offene Registrierungen</h3>
<div id="pending">Lade Mitarbeiter...</div>
</div>

<div class="card">
<h3>✅ Aktive Mitarbeiter</h3>
<div id="active">Lade Mitarbeiter...</div>
</div>

<div id="message" class="status"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://zzryzpjoxxpzfrzzlsvs.supabase.co";
const SUPABASE_KEY = "sb_publishable_SQgTXMfuzKWQ55_nvTNRaA_Z7pFL9_R";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const pendingBox = document.getElementById("pending");
const activeBox = document.getElementById("active");
const message = document.getElementById("message");
const createMessage = document.getElementById("createMessage");
const createForm = document.getElementById("createForm");

async function loadTeam() {
  message.textContent = "Prüfe Anmeldung...";

  try {
    const { data: authData, error: authError } = await supabase.auth.getUser();

    if (authError) throw authError;

    if (!authData.user) {
      message.textContent = "Keine Sitzung erkannt.";
      return;
    }

    const { data: me, error: meError } = await supabase
      .from("profiles")
      .select("role,status")
      .eq("id", authData.user.id)
      .single();

    if (meError) throw meError;

    if (me.role !== "manager" || me.status !== "active") {
      message.textContent = "Kein Manager-Zugriff.";
      return;
    }

    message.textContent = "Lade Teamdaten...";

    const { data, error } = await supabase
      .from("profiles")
      .select("id,display_name,role,status,created_at")
      .order("created_at", { ascending: true });

    if (error) throw error;

    const waiting = data.filter(p => p.status === "pending");
    const working = data.filter(p => p.status === "active");

    pendingBox.innerHTML = "";
    activeBox.innerHTML = "";

    if (waiting.length === 0) {
      pendingBox.innerHTML = '<div class="empty">Keine offenen Registrierungen.</div>';
    }

    waiting.forEach(p => {
      const div = document.createElement("div");
      div.className = "person";

      const info = document.createElement("div");

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = p.display_name || "Unbekannt";

      const role = document.createElement("div");
      role.className = "email";
      role.textContent = p.role === "manager" ? "Manager" : "Mitarbeiter";

      info.append(name, role);

      const btn = document.createElement("button");
      btn.className = "approve";
      btn.textContent = "Freischalten";
      btn.onclick = () => approve(p.id);

      div.append(info, btn);
      pendingBox.append(div);
    });

    if (working.length === 0) {
      activeBox.innerHTML = '<div class="empty">Noch keine aktiven Mitarbeiter.</div>';
    }

    working.forEach(p => {
      const div = document.createElement("div");
      div.className = "person";

      const info = document.createElement("div");

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = p.display_name || "Unbekannt";

      const role = document.createElement("div");
      role.className = "email";
      role.textContent = p.role === "manager" ? "Manager" : "Mitarbeiter";

      info.append(name, role);
      div.append(info);
      activeBox.append(div);
    });

    message.textContent = "Team erfolgreich geladen.";

  } catch (err) {
    message.textContent = "Fehler: " + err.message;
  }
}

async function approve(id) {
  message.textContent = "Freischaltung läuft...";

  try {
    const { error } = await supabase
      .from("profiles")
      .update({ status: "active" })
      .eq("id", id);

    if (error) throw error;

    message.textContent = "Mitarbeiter freigeschaltet!";
    await loadTeam();

  } catch (err) {
    message.textContent = "Fehler: " + err.message;
  }
}

createForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  createMessage.textContent = "Mitarbeiter wird erstellt...";

  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const email = document.getElementById("newEmail").value.trim();
  const password = document.getElementById("newPassword").value;

  try {
    const { data, error } = await supabase.functions.invoke("create-employee", {
      body: {
        firstName,
        lastName,
        email,
        password
      }
    });

    if (error) throw error;
    if (data?.error) throw new Error(data.error);

    createMessage.textContent = "Mitarbeiter erfolgreich erstellt!";
    createForm.reset();
    await loadTeam();

  } catch (err) {
    createMessage.textContent = "Fehler: " + (err.message || "Erstellung fehlgeschlagen");
  }
});

loadTeam();
</script>
</body>
</html>
