
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1119">
<title>PozzaPlan – Team</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1119;color:#f2f5f9;font-family:system-ui,-apple-system,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.container{max-width:850px;margin:auto;padding:20px 16px 40px}
.brand{font-size:24px;font-weight:850;color:#f97316}
.sub{font-size:12px;color:#94a3b8}
header{margin-bottom:24px}
.back{display:block;color:#fb923c;text-decoration:none;margin:20px 0}
.section{background:#17212d;border:1px solid #263546;border-radius:18px;padding:18px;margin-bottom:18px}
h1{font-size:23px;margin:0 0 8px}
h2{font-size:18px;margin:0}
.muted{color:#94a3b8;font-size:14px}
.form label{display:block;font-size:13px;color:#cbd5e1;margin-top:14px}
.form input,.form select{
width:100%;background:#0e1823;color:white;border:1px solid #334155;
border-radius:12px;padding:12px;margin-top:7px
}
.add{width:100%;background:#f97316;color:white;border:0;border-radius:12px;padding:13px;margin-top:18px;font-weight:750}
.employee{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#0e1823;border:1px solid #263546;border-radius:14px;padding:15px;margin-top:12px}
.employee-name{font-weight:750}
.employee-role{font-size:13px;color:#94a3b8;margin-top:4px}
.employee-actions{display:flex;gap:7px}
.del{background:#40232a;color:#fca5a5;border:0;border-radius:10px;padding:9px;font-size:12px}
.badge{background:#143426;color:#86efac;border-radius:8px;padding:6px 9px;font-size:11px}
.empty{margin-top:15px;color:#94a3b8;font-size:14px}
.count{font-size:30px;font-weight:800;margin-top:12px}
@media(min-width:650px){.container{padding:30px}}
</style>
</head>
<body>
<div class="container">

<header>
<div class="brand">🍕 PozzaPlan</div>
<div class="sub">Pizzeria · Teamverwaltung</div>
</header>

<a class="back" href="./index.html">← Zur Übersicht</a>

<section class="section">
<h1>Unser Team</h1>
<div class="muted">Verwalte die Mitarbeiter deiner Pizzeria.</div>
<div class="count" id="count">0</div>
<div class="muted">Mitarbeiter</div>
</section>

<section class="section">
<h2>Mitarbeiter hinzufügen</h2>

<div class="form">
<label>Vorname und Nachname</label>
<input id="name" placeholder="z. B. Max Mustermann">

<label>Position / Tätigkeit</label>
<select id="role">
<option value="Service">Service</option>
<option value="Küche">Küche</option>
<option value="Pizza">Pizzabäcker</option>
<option value="Lieferdienst">Lieferdienst</option>
<option value="Allrounder">Allrounder</option>
<option value="Leitung">Leitung</option>
<option value="Sonstiges">Sonstiges</option>
</select>

<button class="add" id="add">+ Mitarbeiter hinzufügen</button>
</div>
</section>

<section class="section">
<h2>Personalübersicht</h2>
<div id="list"></div>
</section>

</div>

<script>
let team=JSON.parse(localStorage.getItem("pozzaplan_team")||"[]");

function save(){
 localStorage.setItem("pozzaplan_team",JSON.stringify(team));
 render();
}

function escapeHTML(str){
 return String(str).replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[m]));
}

function render(){
 document.getElementById("count").textContent=team.length;
 const list=document.getElementById("list");

 if(team.length===0){
  list.innerHTML='<div class="empty">Noch keine Mitarbeiter eingetragen.</div>';
  return;
 }

 list.innerHTML=team.map(person=>`
 <div class="employee">
  <div>
   <div class="employee-name">${escapeHTML(person.name)}</div>
   <div class="employee-role">${escapeHTML(person.role)}</div>
  </div>
  <div class="employee-actions">
   <span class="badge">Aktiv</span>
   <button class="del" data-id="${person.id}">Entfernen</button>
  </div>
 </div>
 `).join("");

 document.querySelectorAll(".del").forEach(btn=>{
  btn.onclick=()=>{
   if(confirm("Mitarbeiter wirklich entfernen?")){
    team=team.filter(p=>p.id!==btn.dataset.id);
    save();
   }
  };
 });
}

document.getElementById("add").onclick=()=>{
 const name=document.getElementById("name").value.trim();
 const role=document.getElementById("role").value;

 if(!name){
  alert("Bitte einen Namen eingeben.");
  return;
 }

 team.push({
  id:String(Date.now()),
  name,
  role
 });

 save();
 document.getElementById("name").value="";
};

render();
</script>
</body>
</html>
